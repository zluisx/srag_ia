spring.application.name=srag-uti-backend

# ---------- Banco de dados ----------
# Padrão: H2 em arquivo (pasta ./data). Para PostgreSQL, defina as variáveis de ambiente:
#   DB_URL=jdbc:postgresql://localhost:5432/srag  DB_USER=postgres  DB_PASSWORD=...
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/srag}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---------- JWT ----------
# TROQUE o segredo (mínimo 32 caracteres) e nunca o suba para o GitHub.
jwt.secret=${JWT_SECRET:troque-este-segredo-por-um-com-pelo-menos-32-caracteres}
jwt.expiracao-minutos=${JWT_EXPIRACAO_MIN:60}

# ---------- Integração com o modelo de IA ----------
# mock = valor de mentira (para desenvolver sem a IA)
# http = chama o serviço Python (servico-ia) em MODELO_URL
modelo.modo=${MODELO_MODO:mock}
modelo.url=${MODELO_URL:http://localhost:8000}
modelo.esquema-path=${MODELO_ESQUEMA:classpath:modelo/esquema_entrada.json}

# ---------- Usuários iniciais (criados só se o banco estiver vazio) ----------
app.seed.gestor-email=${SEED_GESTOR_EMAIL:gestor@srag.local}
app.seed.gestor-senha=${SEED_GESTOR_SENHA:gestor12345}
app.seed.operador-email=${SEED_OPERADOR_EMAIL:operador@srag.local}
app.seed.operador-senha=${SEED_OPERADOR_SENHA:operador12345}

# ---------- Swagger ----------
springdoc.swagger-ui.path=/swagger-ui.html
